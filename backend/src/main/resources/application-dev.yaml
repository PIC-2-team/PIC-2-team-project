spring:
  datasource:
    url: jdbc:h2:mem:samgyeol;MODE=MySQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:5176,http://localhost:5177}

vapid:
  public-key: ${VAPID_PUBLIC_KEY:BJsrbiG-X0FIkVco6keQHss34wLC6fbmmhqJKr2plyxeBssmMts7D_GLRGqV79ipJAznnW4O1cMKz4QqP-wHTfc}
  private-key: ${VAPID_PRIVATE_KEY:l6qfozmRdRq9z8Qi0ErmEv0JHQYXbL3a12g8l1f2ZfM}
  subject: ${VAPID_SUBJECT:mailto:admin@samgyeol.com}

logging:
  level:
    com.project.backend: DEBUG
    org.hibernate.SQL: DEBUG

app:
  seed-test-accounts: true
