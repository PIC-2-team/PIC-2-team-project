spring:
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  application:
    name: backend
  profiles:
    active: dev

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui

jwt:
  secret: ${JWT_SECRET:dev-secret-key-must-be-at-least-32-characters-long}
  access-token-expiry-seconds: 900      # 15분
  refresh-token-expiry-days: 30
